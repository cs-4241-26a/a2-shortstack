<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Radio+Canada:ital,wght@0,300..700;1,300..700&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>

    <div id="box">
      <h1>Welcome to Age Sort</h1>
      <p>
      Insert your Name, Birth Year, and your Class and we will sort by the age you turn in 2026!
      </p>
    </div>
    
    <div id="box2">
      <h2>My Information</h2>

      <form id="user_form">
        <fieldset>
          <legend>User Information</legend>
          <p>
            <label for="name">Name *:</label>
            <input type="text" id="user_name" name="user_name" required/>
          </p>
          <p>
            <label for="birth_year">Birth Year *:</label>
            <input type="number" id="birth_year" name="birth_year" min="0" max="2026" required/>
          </p>
          <p>
            <label for="user_class">
              <span>Class:</span>
            </label>
            <select id="user_class" name="user_class">
              <option value="freshman">Freshman</option>
              <option value="sophomore">Sophomore</option>
              <option value="junior">Junior</option>
              <option value="senior">Senior</option>
            </select>
          </p>
          <p class="button">
            <button type="submit">Submit!</button>
          </p>
        </fieldset>
      </form>
    </div>
    



    <div id="box2">
      <h2>User Information</h2>

      <table id="age_table">
        <thread>
          <tr>
            <th>Name</th>
            <th>Class</th>
            <th>Birth Year</th>
            <th>Age</th>
          </tr>
          <tbody id="age_table_body">
          </tbody>
        </thread>
      </table>

    </div>


  </body>
</html>

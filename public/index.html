<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>

    <h1>Welcome to Age Sort</h1>
    <p>
    Insert your Name, Birth Year, and your Class and we will sort by the age you turn in 2026!
    </p>

    <h2>My Information</h2>

    <form id="user_form">
      <fieldset>
        <legend>User Information</legend>
        <p>
          <label for="name">Name *:</label>
          <input type="text" id="name" name="user_name" required/>
        </p>
        <p>
          <label for="birth_year">Birth Year *:</label>
          <input type="number" id="birth_year" name="birth_year" min="0" max="2026" required/>
        </p>
        <p>
          <label for="user_class">
            <span>Class:</span>
          </label>
          <select id="user_class" name="user_class">
            <option value="freshman">Freshman</option>
            <option value="sophomore">Sophomore</option>
            <option value="junior">Junior</option>
            <option value="senior">Senior</option>
          </select>
        </p>
        <p class="button">
          <button type="submit">Submit!</button>
        </p>
      </fieldset>
    </form>

    <h2>User Information</h2>


    <table id="age_table">
      <thread>
        <tr>
          <th>Name</th>
          <th>Class</th>
          <th>Birth Year</th>
          <th>Age</th>
        </tr>
        <tbody id="age_table_body">
        </tbody>
      </thread>
    </table>


  </body>
</html>

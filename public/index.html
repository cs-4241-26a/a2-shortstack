<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>

  <body>
    <h1>welcome to the Animal Identification Tool</h1>
    <p>the intended use of this tool is to identify an animal the user has observed. this works for all animals.</p>
    <p>below the form are the results.</p>
    <form>
      <label for="q0">give the animal a placeholder name.</label>
      <input type="text" name="q0" id="q0"><br><br>
      <label for="q1">does the animal look like a duck?</label>
      <select name="q1" id="q1">
        <option value="y">yes</option>
        <option value="n">no</option>
        </select><br><br>
      <label for="q2">does the animal swim like a duck?</label>
      <select name="q2" id="q2">
        <option value="y">yes</option>
        <option value="n">no</option>
        </select><br><br>
      <label for="q3">does the animal quack like a duck?</label>
      <select name="q3" id="q3">
        <option value="y">yes</option>
        <option value="n">no, it doesn't quack</option>
        <option value="n">no, it quacks like something else</option>
        </select><br><br>
      <button type="submit" class="submit">submit</button>
    </form>

    <table>
      <thead> 
        <tr>
          <td>Name</td>
          <td>Looks ducklike</td>
          <td>Swims ducklike</td>
          <td>Quacks ducklike</td>
          <td>Identity</td>
        </tr>
      </thead>
      <tbody id="results">

      </tbody>
    </table>
  </body>
</html>
